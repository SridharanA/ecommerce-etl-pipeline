name: ecommerce-cicd-etl-automation

on:
  push:
    branches:
      - main

jobs:
  ci-pipeline-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD_PAT}}
      
      - name: build + push image to dockerhub
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: dharansri534/ecommerce-etl-pipeline

  cd-pipeline-job:
    needs: ci-pipeline-job

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: set the kubernetes context using kubeconfig method
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{secrets.KUBECONFIG_DATA}}

      - name: set the deployment.yml(to run container in pods), service.yml(for load balancer to pods)
        run: |
          kubectl apply -f deployment.yml
          kubectl apply -f service.yml